[package]
name = "tasks-foundation"
version = "0.0.0"
edition = "2024"
publish = false

[features]
pty = ["dep:portable-pty", "dep:libc"]
native = ["dep:gpui", "pty"]

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"], optional = true }
portable-pty = { version = "=0.9.0", optional = true }
libc = { version = "=0.2.190", optional = true }

[build-dependencies]
cc = "=1.8.0"

[[bin]]
name = "terminal-spike"
path = "src/main.rs"
required-features = ["native"]

[[bin]]
name = "gpui-text-smoke"
path = "src/text_smoke.rs"
required-features = ["native"]
